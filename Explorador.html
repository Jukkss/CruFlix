<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>

<!-- Barra de pesquisa -->
<header style="padding: 5px;">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col-md-3 d-flex justify-content-center">
                <a class="navbar-brand" href="HomePage.html">
                    <img src="imagens/Logo1.png" style="max-height: 70px; max-width: 70px; border-radius: 50%;">
                </a>
            </div>
            <div class="col-md-9 p-2">
                <form class="d-flex" onsubmit="handleSearch(event)">
                    <div class="input-group">
                        <input type="search" id="searchInput" class="form-control" placeholder="Pesquisar..." aria-label="Search" style="height: 40px;">
                        <button class="btn btn-outline-secondary" type="submit" style="background-color: white; height: 40px;">
                            <img src="imagens/pesq.png" style="max-width: 25px;">
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</header>

<!-- Filtro por Gênero -->
<div class="conteudo d-flex">
    <div class="container-fluid">
        <div class="row">
            <!-- Filtro de gênero -->
            <div class="col-md-3 mt-3" style="background-color: #10002e; border-radius: 30px; max-height:400px ;">
                <h1 class="text-center p-2 m-4" style="font-family: Impact; font-size: 30px; background-color: aliceblue; color: #10002e; border-radius: 50px;">FILTRO</h1>
                <select id="filterGenre" class="form-select form-select-lg mb-4" aria-label="Genre select">
                    <option value="">Todos os Gêneros</option>
                    <option value="Ação">Ação</option>
                    <option value="Drama">Drama</option>
                    <option value="Comédia">Comédia</option>
                    <option value="Ficção Científica">Ficção Científica</option>
                </select>
            </div>

            <!-- Séries -->
            <div class="col-md-9 mt-3">
                <div id="seriesContainer" class="row gy-4">
                    <!-- As séries serão carregadas aqui -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 start-0 p-3">
    <div id="genreToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header" style="background-color: #10002e;color: aliceblue;">
            <strong class="me-auto">Gênero de Séries</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toastMessage" >
            Nenhum gênero selecionado
        </div>
    </div>
</div>

<!-- Modal para detalhes -->
<div class="modal fade" id="seriesModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" style="background-color: white; color: #10002e; border-radius: 20px;">
            <div class="modal-header" style="background-color: #10002e;">
                <a class="navbar-brand" href="HomePage.html">
                    <img src="imagens/Logo1.png" style="max-height: 70px; max-width: 70px; border-radius: 50%;">
                </a>
                <h1 style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; padding: 10px; color: aliceblue; font-size: 35px; margin-left: 10px;">Visão Geral</h1>
                <button type="button" class="btn-close btn-dark" data-bs-dismiss="modal" aria-label="Close" style="filter: invert(1);"></button>
            </div>
            <div class="modal-body">
                <div id="modalContent">
                </div>
            </div>
        </div>
    </div>
</div>

<script src="Cfonte/CodFontePesquisador.js"></script>
</body>
</html>
